name: Tests
on: 
  - push
  - workflow_dispatch

jobs:

  normal:
    runs-on: 
      group: Default
      labels: [ self-hosted, Linux ]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to get tags

      - name: Create test files
        run: |
          mkdir -p build/release
          echo "Test" > build/release/test.bin

      - run: pwd
      - run: ls -la

      - name: Run action (self-test)
        uses: ./.  # reference the action in the current repo
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          target: ${{ secrets.TARGET }}
          build_type: 'dev'
          files: build/release/*.bin
          message: "Test from self-test workflow (normal)"
          add_git_info: "true"

      - name: Run action (self-test with a hosted api)
        uses: ./.  # reference the action in the current repo
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          target: ${{ secrets.TARGET }}
          api_uri: "http://10.42.0.126:8081" 
          build_type: 'dev'
          files: build/release/*.bin
          message: "Test from self-test workflow (normal)"
          add_git_info: "true"
          

  inside_container:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest

    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to get tags

      - name: Create test files
        run: |
          mkdir -p build/release
          echo "Test" > build/release/test.bin

      - run: pwd
      - run: ls -la

      - name: Run action (self-test)
        uses: ./.  # reference the action in the current repo
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          target: ${{ secrets.TARGET }}
          build_type: 'main'
          files: build/release/*.bin
          message: "Test from self-test workflow (inside_container)"
          add_git_info: "true"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install and Run
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements-dev.txt
          pytest tests/*
